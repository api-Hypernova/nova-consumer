<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-title" content="NOVA Enterprise">
  <link rel="apple-touch-icon" href="icon.jpg">
  <link rel="icon" href="icon.jpg">
  <title>NOVA Enterprise</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #111113;
      -webkit-user-select: none;
      user-select: none;
    }
    .container {
      text-align: center;
      padding: 40px 20px;
    }
    .icon {
      width: 120px;
      height: 120px;
      border-radius: 27px;
      margin-bottom: 24px;
      box-shadow: 0 8px 26px rgba(0,0,0,0.20), 0 1px 4px rgba(0,0,0,0.12);
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    .tagline {
      font-size: 14px;
      color: rgba(0,0,0,0.55);
      margin-bottom: 40px;
    }
    .launch-btn {
      display: inline-block;
      padding: 16px 48px;
      background: linear-gradient(135deg, #f2d675 0%, #c9a227 55%, #a67c0e 100%);
      color: #2a1c00;
      font-size: 18px;
      font-weight: 600;
      border-radius: 14px;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(201,162,39,0.40);
      transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .launch-btn:active { transform: scale(0.96); }
    .status { margin-top: 32px; font-size: 12px; color: rgba(0,0,0,0.45); }
    .spinner {
      display: none;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(0,0,0,0.12);
      border-top-color: #a67c0e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <img src="icon.jpg" alt="NOVA" class="icon">
    <h1>NOVA Enterprise</h1>
    <p class="tagline">Salon &amp; Staff Management</p>
    <a href="#" class="launch-btn" id="launchBtn">Open App</a>
    <div class="spinner" id="spinner"></div>
    <p class="status" id="status"></p>
  </div>
  <script>
    var TUNNEL_API = "https://api-hypernova.github.io/nova-consumer/vendor/tunnel.json";
    var EXPO_URL = null;

    function launchApp() {
      if (EXPO_URL) {
        // SDK 58 launch flags: hide Expo Go's blue floating tools button and the first-run tips (this launch only)
        var flags = "__expo_disable_fab=1&__expo_disable_onboarding=1";
        window.location.href = EXPO_URL + (EXPO_URL.indexOf("?") === -1 ? "?" : "&") + flags;
      }
    }

    function fetchTunnelUrl() {
      document.getElementById("status").textContent = "Connecting...";
      fetch(TUNNEL_API + "?t=" + Date.now())
        .then(function(r) { return r.json(); })
        .then(function(data) {
          EXPO_URL = data.url;
          document.getElementById("status").textContent = "";
          document.getElementById("launchBtn").style.opacity = "1";
          document.getElementById("launchBtn").style.pointerEvents = "auto";
          if (window.navigator.standalone) {
            launchApp();
          }
        })
        .catch(function() {
          document.getElementById("status").textContent = "Server is starting up, please wait...";
          setTimeout(fetchTunnelUrl, 3000);
        });
    }

    document.getElementById("launchBtn").style.opacity = "0.5";
    document.getElementById("launchBtn").style.pointerEvents = "none";

    document.getElementById("launchBtn").addEventListener("click", function(e) {
      e.preventDefault();
      document.getElementById("spinner").style.display = "block";
      document.getElementById("status").textContent = "Launching NOVA Enterprise...";
      launchApp();
      setTimeout(function() {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("status").textContent = "If the app didn't open, install Expo Go from the App Store.";
      }, 2500);
    });

    fetchTunnelUrl();
  </script>
</body>
</html>
